<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AYAYAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <button class="mute" id="mute" aria-label="Suara"><img id="muteIcon" alt=""></button>

  <!-- PAGE 1 -->
  <section id="p1" class="page active">
    <div class="panel">
      <h1 class="title" aria-label="AYAYAM"><span style="--i:0">A</span><span style="--i:1">Y</span><span style="--i:2">A</span><span style="--i:3">Y</span><span style="--i:4">A</span><span style="--i:5">M</span></h1>
      <button class="btn" id="playBtn">PLAY</button>
      <div class="credit">by: eternityll0ve</div>
    </div>
    <canvas id="grassB" class="grass"></canvas>
    <canvas id="grass" class="grass"></canvas>
  </section>

  <!-- PAGE 2 -->
  <section id="p2" class="page scene">
    <div class="floor"></div>
    <div class="vase" id="vase"><div class="flowers" id="flowers"></div><canvas id="vaseCv" class="vase-cv"></canvas><canvas id="shelfCv" class="shelf-cv"></canvas></div>
    <div class="meter" id="meter"></div>
    <div class="hay" id="hay"><canvas id="hayCv"></canvas><div class="foods" id="foods"></div></div>
    <div class="hen-wrap" id="henWrap">
      <div class="bubble" id="bubble"><canvas id="reqCv"></canvas></div>
      <div class="hen-in" id="henIn"><canvas id="henCv"></canvas></div>
      <div class="fx" id="fx"></div>
    </div>
  </section>

  <!-- PAGE 3 -->
  <section id="p3" class="page scene">
    <div class="floor"></div>
    <div class="night"></div>
    <div class="stars" id="stars"></div>
    <canvas id="moon" class="moon"></canvas>
    <div class="cap">NOM NOM!</div>
    <div class="sleep-col">
      <div class="hen-wrap sl" id="henWrap3">
        <div class="glow"></div>
        <div class="hen-in" id="henIn3"><canvas id="henCv3"></canvas></div>
        <canvas id="zbub" class="zbub"></canvas>
        <div class="zzz"><span>Z</span><span>Z</span><span>Z</span></div>
      </div>
      <button class="btn" id="againBtn">PLAY AGAIN</button>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
